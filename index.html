const main=document.getElementById('main'),crumbs=document.getElementById('breadcrumbs');
function el(tag,text,cls){const e=document.createElement(tag);if(text)e.textContent=text;if(cls)e.className=cls;return e;}
function link(text,href,cls){const a=el('a',text,cls);a.href=href;return a;}
function route(y,t){return y?'#serie='+y+(t?'&bimestre='+t:''):'#';}
function tile(n,label,url,color){const a=link('',url,'grade g'+color);a.setAttribute('aria-label',n+'º '+(label==='ANO'?'ano':'bimestre'));a.append(el('span',n+'º','num'),el('span',label,'label'));const arrow=el('span','➜','arrow');arrow.setAttribute('aria-hidden','true');a.append(arrow);return a;}
function icon(kind){const e=document.createElementNS('http://www.w3.org/2000/svg','svg');e.setAttribute('viewBox','0 0 24 24');e.setAttribute('fill','none');e.setAttribute('stroke','currentColor');e.setAttribute('stroke-width','1.8');e.setAttribute('stroke-linecap','round');e.setAttribute('stroke-linejoin','round');e.setAttribute('aria-hidden','true');const paths={sound:'M3 9v6h4l5 4V5L7 9H3 M16 8a6 6 0 0 1 0 8 M19 5a10 10 0 0 1 0 14',cards:'M9 3h12v15H9z M5 7H3v14h13v-1',letters:'M3 18L8 5l5 13 M5 13h6 M15 16l3 3 4-6'};const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',paths[kind]||paths.sound);e.append(p);return e;}
function remember(a,y,t){a.addEventListener('click',()=>{try{sessionStorage.setItem('english-catalog-return',route(y,t));}catch{}});}
function render(focus=false){const p=new URLSearchParams(location.hash.slice(1));let y=Number(p.get('serie')),t=Number(p.get('bimestre'));if(!Number.isInteger(y)||y<1||y>5)y=0;if(!y||!Number.isInteger(t)||t<1||t>4)t=0;document.body.classList.toggle('home',!y);main.replaceChildren();crumbs.replaceChildren();crumbs.append(link('Início','#'));if(y)crumbs.append(el('span','›'),link(y+'º ano',route(y)));if(t)crumbs.append(el('span','›'),el('span',t+'º bimestre'));crumbs.lastChild.setAttribute('aria-current','page');
const heading=el('div','','heading');const h=el('h1');if(!y){h.append(document.createTextNode('Vamos '),el('em','brincar'),document.createTextNode(' e aprender?'));}else h.textContent=t?y+'º ano · '+t+'º bimestre':y+'º ano';heading.append(h,el('p',!y?'Escolha sua série':!t?'Escolha o bimestre':'Escolha um tema e uma brincadeira'));main.append(heading);document.title=(!y?'Jogos de Inglês':h.textContent)+' | English';
if(!t){const grid=el('div','',y?'grades terms':'grades');for(let i=1;i<=(y?4:5);i++)grid.append(tile(i,y?'BIMESTRE':'ANO',y?route(y,i):route(i),y||i));main.append(grid);}
else{const list=games.filter(g=>g.year===y&&g.term===t);if(!list.length){const box=el('section','','empty');box.append(el('h2','Novos jogos em breve!'),el('p','Estamos preparando as atividades deste bimestre.'),link('← Escolher outro bimestre',route(y),'back'));main.append(box);}else{const topics=el('div','','topics');const groups=new Map();for(const g of list){if(!groups.has(g.title))groups.set(g.title,[]);groups.get(g.title).push(g);}for(const [title,entries] of groups){const topic=el('section','','topic'),head=el('div','','topic-head');if(entries[0].image){const img=el('img');img.src=entries[0].image;img.alt='';head.append(img);}const copy=el('div');copy.append(el('h2',title),el('p',entries[0].description||''));head.append(copy);topic.append(head);const activities=el('div','','activities');for(const g of entries){const mode=modes[g.type]||{label:g.type,icon:'sound'};const cell=el('div','','activity');const a=link('',g.file,'launch');const text=el('span','','copy');text.append(el('b',mode.label),el('small',g.type+(g.adapted?' · Versão adaptada':'')));a.append(icon(mode.icon),text,el('span','→','go'));remember(a,y,t);cell.append(a);activities.append(cell);}topic.append(activities);topics.append(topic);}main.append(topics);}}
if(focus){main.focus({preventScroll:true});window.scrollTo(0,0);}}
window.addEventListener('hashchange',()=>render(true));render();
