<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#244d78">
<title>English • Jogos de Inglês</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;font-family:Arial,Helvetica,sans-serif;color:#193c60;background:radial-gradient(ellipse at 0 0,#f1c9df,transparent 55%),radial-gradient(ellipse at 100% 20%,#b9cfef,transparent 55%),radial-gradient(ellipse at 10% 100%,#cde7ba,transparent 50%),#e7f2ef}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}a{color:inherit}button:focus-visible,a:focus-visible{outline:4px solid #e99c1f;outline-offset:5px}.shell{max-width:1050px;margin:auto;padding:clamp(20px,5vw,58px) 22px 24px;min-height:100dvh;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:13px;text-decoration:none;width:fit-content}.logo{display:grid;place-items:center;width:50px;height:50px;background:#244d78;border-radius:17px;color:white;font-weight:900;font-size:24px;box-shadow:0 6px 18px #244d7826}.brand strong{font-size:24px;letter-spacing:1px}.brand small{display:block;font-size:13px;margin-top:4px;color:#526c82}nav{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:34px 0 26px;min-height:25px;font-size:14px}nav a{text-decoration:none;border-bottom:1px solid #244d7850;padding:5px 0}nav span{color:#536b80}main{flex:1}h1{font-size:clamp(30px,5vw,48px);letter-spacing:-1px;margin:0 0 12px;line-height:1.12}.intro{font-size:17px;line-height:1.6;margin:0 0 32px;color:#456077}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.tile{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;min-height:220px;padding:25px;border:1px solid #fff;border-radius:26px;background:#ffffffd9;box-shadow:0 9px 25px #244d7810;text-decoration:none;transition:transform .15s,box-shadow .15s}.tile:hover{transform:translateY(-4px);box-shadow:0 12px 26px #244d7825}.number{font-size:64px;font-weight:900;color:var(--accent,#2979bb);line-height:1.15}.tile-label{font-size:19px;font-weight:700;margin-top:18px}.tile-foot{font-size:13px;color:#526c82;margin-top:12px}.tile-foot b{font-size:20px;margin-left:8px}.empty{background:#ffffffd9;border:1px solid white;border-radius:28px;padding:clamp(25px,5vw,48px);text-align:center;max-width:720px;margin:20px auto 0;box-shadow:0 9px 25px #244d7810}.empty-icon{margin:0 auto 20px;width:70px;height:70px;border-radius:22px;background:#e5effa;display:grid;place-items:center;color:#3978b5}.empty h2{font-size:26px;margin:0 0 12px}.empty p{line-height:1.6;color:#526c82;margin:0 0 24px}.back{display:inline-block;background:#244d78;color:white;text-decoration:none;padding:15px 22px;border-radius:15px;font-weight:700}.game{min-height:180px}.game .tile-label{margin:0;font-size:23px}.badge{font-size:12px;background:#edf3fb;padding:7px 10px;border-radius:9px;color:#3978b5;margin:14px 0}.game .tile-foot{margin-top:auto}footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:54px;padding-top:18px;border-top:1px solid #244d7820;color:#526c82;font-size:12px}footer a{text-decoration:none}.test-tag{background:#ffffff90;padding:5px 9px;border-radius:8px} @media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{min-height:190px}.number{font-size:56px}}@media(max-width:380px){.shell{padding:22px 16px}.grid{gap:12px}.tile{padding:18px;min-height:170px}.number{font-size:48px}.tile-label{font-size:17px}}@media(prefers-reduced-motion:reduce){.tile{transition:none}.tile:hover{transform:none}}
</style>
</head>
<body>
<div class="shell">
<header><a class="brand" href="#" aria-label="Jogos de Inglês — início"><span class="logo" aria-hidden="true">E</span><span><strong>ENGLISH</strong><small>Jogos de Inglês</small></span></a></header>
<nav id="breadcrumbs" aria-label="Caminho de navegação"></nav>
<main id="main" tabindex="-1"></main>
<footer><span>Aprender inglês, uma brincadeira de cada vez.</span><span class="test-tag">Página de teste</span></footer>
<noscript>Ative o JavaScript do navegador para escolher a série e o bimestre.</noscript>
</div>
<script>
// Acrescente aqui os jogos quando estiverem prontos. O mesmo arquivo pode aparecer
// em mais de uma combinação de série e bimestre.
// Exemplo: {title:'Numbers',type:'Listen and Choose',year:2,term:4,file:'jogos/NUMBERS.html'}
const games = [];
const colors=['#2979bb','#6b59b1','#267e6d','#b9702b'];
const main=document.getElementById('main');
const crumbs=document.getElementById('breadcrumbs');
function element(tag,text,className){const e=document.createElement(tag);if(text)e.textContent=text;if(className)e.className=className;return e;}
function link(text,href,className){const a=element('a',text,className);a.href=href;return a;}
function route(year,term){return year?'#serie='+year+(term?'&bimestre='+term:''):'#';}
function tile(number,label,href,index){const a=link('',href,'tile');a.style.setProperty('--accent',colors[index]);a.append(element('span',number,'number'),element('span',label,'tile-label'));const foot=element('span','Escolher','tile-foot');foot.append(element('b','→'));a.append(foot);return a;}
function render(focus=false){
 const params=new URLSearchParams(location.hash.slice(1));let year=Number(params.get('serie'));let term=Number(params.get('bimestre'));
 if(!Number.isInteger(year)||year<1||year>4)year=0;
 if(!year||!Number.isInteger(term)||term<1||term>4)term=0;
 crumbs.replaceChildren();main.replaceChildren();crumbs.append(link('Início','#'));
 if(year){crumbs.append(element('span','›'),link(year+'º ano',route(year)));}
 if(term){crumbs.append(element('span','›'),element('span',term+'º bimestre'));crumbs.lastChild.setAttribute('aria-current','page');}
 const title=!year?'Vamos brincar e aprender?':!term?year+'º ano':year+'º ano · '+term+'º bimestre';
 document.title=(!year?'Jogos de Inglês':title)+' | English';main.append(element('h1',title));
 main.append(element('p',!year?'Escolha sua série para encontrar os jogos.':!term?'Agora, escolha o bimestre.':'Escolha uma atividade e divirta-se aprendendo inglês.','intro'));
 const grid=element('div','','grid');
 if(!year){for(let i=1;i<=4;i++)grid.append(tile(i+'º','ANO',route(i),i-1));}
 else if(!term){for(let i=1;i<=4;i++)grid.append(tile(i+'º','BIMESTRE',route(year,i),i-1));}
 else{
  const list=games.filter(g=>g.year===year&&g.term===term);
  if(!list.length){const box=element('section','','empty');const icon=element('div','','empty-icon');icon.setAttribute('aria-hidden','true');icon.innerHTML='<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5c3-1 6-1 9 1 3-2 6-2 9-1v15c-3-1-6-1-9 1-3-2-6-2-9-1zM12 6v15"/></svg>';box.append(icon,element('h2','Novos jogos em breve!'),element('p','Estamos preparando as atividades deste bimestre. Logo você poderá jogar por aqui.'),link('← Escolher outro bimestre',route(year),'back'));main.append(box);}
  for(const g of list){const a=link('',g.file,'tile game');a.append(element('span',g.title,'tile-label'),element('span',g.type,'badge'),element('span','JOGAR →','tile-foot'));a.addEventListener('click',()=>{try{sessionStorage.setItem('english-catalog-return',route(year,term));}catch{}});grid.append(a);}
 }
 if(grid.children.length)main.append(grid);
 if(focus){main.focus({preventScroll:true});window.scrollTo(0,0);}
}
// Jogos poderão retornar para ../index.html#serie=2&bimestre=4.
window.addEventListener('hashchange',()=>render(true));render();
</script>
</body>
</html>
